<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840"><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity=".1"/></filter><clipPath id="screen"><rect x="105" y="100" width="990" height="640" rx="13"/></clipPath></defs><rect width="1200" height="840" fill="#e0e5d9"/><g font-family="Arial,Helvetica,sans-serif"><text x="100" y="168" font-size="38" fill="#4b5b41" font-weight="500" >still</text><text x="100" y="331" font-size="80" fill="#4b5b41" font-weight="400" letter-spacing="-3">A little</text><text x="100" y="416" font-size="80" fill="#4b5b41" font-weight="400" letter-spacing="-3">more space.</text><text x="102" y="477" font-size="19" fill="#7a8770" font-weight="400" >A small pause in an always-on world.</text><rect x="102" y="516" width="179" height="47" fill="#556349" rx="24" /><text x="138" y="546" font-size="14" fill="#fff" font-weight="400" >Find your pause</text><text x="102" y="684" font-size="12" fill="#7a8770" font-weight="400" >BREATHE. RESET. BEGIN AGAIN.</text><g filter="url(#shadow)"><rect x="692" y="108" width="316" height="622" fill="#fafaf3" rx="35" /></g><rect x="804" y="122" width="92" height="17" fill="#4b5b41" rx="10" /><text x="718" y="191" font-size="23" fill="#4b5b41" font-weight="500" >Good afternoon.</text><text x="718" y="224" font-size="12" fill="#8b9580" font-weight="400" >There is time for a little pause.</text><text x="821" y="288" font-size="10" fill="#8b9580" font-weight="400" >TODAY</text><circle cx="850" cy="397" r="94" fill="#edf0e4"/><circle cx="850" cy="397" r="83" fill="none" stroke="#c9d3b6" stroke-width="2"/><path d="M850 314a83 83 0 0 1 79 109" fill="none" stroke="#687851" stroke-width="3" stroke-linecap="round"/><text x="791" y="410" font-size="41" fill="#536244" font-weight="400" >05:00</text><text x="820" y="440" font-size="9" fill="#8b9580" font-weight="400" >JUST BE</text><rect x="729" y="529" width="242" height="46" fill="#556349" rx="23" /><text x="791" y="558" font-size="14" fill="#fff" font-weight="400" >Begin a pause</text><text x="720" y="621" font-size="15" fill="#4b5b41" font-weight="600" >Make room for today</text><text x="720" y="650" font-size="12" fill="#8b9580" font-weight="400" >Morning reset</text><text x="938" y="650" font-size="11" fill="#8b9580" font-weight="400" >3 min</text><path d="M720 665H978" stroke="#e4e7dd"/><text x="720" y="692" font-size="12" fill="#8b9580" font-weight="400" >Evening unwind</text><text x="938" y="692" font-size="11" fill="#8b9580" font-weight="400" >8 min</text></g></svg>