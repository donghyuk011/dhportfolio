t-size="11" fill="#6f8465" font-weight="400" >SMALL GROUPS</text><text x="730" y="462" font-size="17" fill="#3f5c40" font-weight="400" >Less noise. More connection.</text><text x="730" y="526" font-size="11" fill="#6f8465" font-weight="400" >FAMILIAR PLACES</text><text x="730" y="559" font-size="17" fill="#3f5c40" font-weight="400" >Find something close to home.</text><text x="730" y="623" font-size="14" fill="#6f8465" font-weight="400" >A shared interest is a good start.</text></g></svg>